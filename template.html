<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:'JBMono';src:url('fonts/JetBrainsMono-Bold.woff2') format('woff2');font-weight:700}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:#FFFFFF;font-family:'Rubik',sans-serif;color:#2A323A}
:root{--o:#F38620;--od:#D9741A;--s:#2A323A;--s2:#4A5663;--muted:#7A8791;--line:#ECEFF2}
#bg{position:absolute;inset:0;overflow:hidden}
#dots{position:absolute;inset:0;background-image:radial-gradient(circle,#DCE1E5 1.7px,transparent 2px);background-size:30px 30px;-webkit-mask-image:radial-gradient(120% 90% at 50% 40%,rgba(0,0,0,0.85),rgba(0,0,0,0.25))}
.glow{position:absolute;border-radius:50%;filter:blur(90px)}
#hdr{position:absolute;left:70px;right:70px;top:46px;height:110px;z-index:10}
#hlogo{position:absolute;left:0;top:4px;height:70px}
#pill{position:absolute;right:0;top:16px;padding:12px 24px;border-radius:999px;border:2px solid #F7CDA6;background:#FFF7EF;color:var(--od);font-family:'JBMono',monospace;font-weight:700;font-size:19px;letter-spacing:0.12em;white-space:nowrap}
#hline{position:absolute;left:0;right:0;top:104px;height:3px;background:var(--line);border-radius:2px}
#prog{position:absolute;left:0;top:103px;height:5px;width:0;background:var(--o);border-radius:3px}
.scene{position:absolute;left:0;right:0;top:170px;bottom:0;opacity:0}
.col{position:absolute;left:70px;right:70px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;text-align:center}
.kick{font-family:'JBMono',monospace;font-weight:700;font-size:22px;letter-spacing:0.16em;color:var(--od);text-transform:uppercase;margin-top:48px}
.kick:before{content:'';display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--o);margin-right:14px;vertical-align:2px}
.h{font-weight:700;font-size:74px;line-height:1.1;letter-spacing:-0.02em;margin-top:22px;max-width:940px}
.h .a{color:var(--o)}
.w{display:inline-block}
.vis{position:relative;flex:1;width:100%;display:flex;align-items:center;justify-content:center;padding-bottom:170px}
.vis svg{overflow:visible}
.card{background:#fff;border:2px solid #EEF1F3;border-radius:28px;box-shadow:0 26px 60px rgba(42,50,58,0.10)}
.tag{font-family:'JBMono',monospace;font-weight:700;font-size:18px;letter-spacing:0.14em;color:var(--muted);text-transform:uppercase}
.ico{flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ico svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.stars{color:var(--o);font-size:24px;letter-spacing:3px}.stars span{color:#D5DCE1}
[data-item]:last-child{border-bottom:none!important}
#cap{position:absolute;left:50%;top:1205px;transform:translateX(-50%);max-width:900px;padding:16px 30px;border-radius:16px;background:#1F262D;color:#fff;font-size:32px;font-weight:700;text-align:center;white-space:nowrap;z-index:12;opacity:0;box-shadow:0 10px 30px rgba(31,38,45,0.25)}
#cap .on{color:#FFB066}
#masc{position:absolute;right:40px;top:985px;width:172px;height:200px;z-index:11;opacity:0}
.mood{display:none}
</style></head>
<body>
<div id="bg"><div class="glow" id="g1" style="width:760px;height:760px;right:-260px;top:-180px;background:rgba(243,134,32,0.13)"></div><div class="glow" id="g2" style="width:700px;height:700px;left:-300px;bottom:-200px;background:rgba(74,86,99,0.07)"></div><div id="dots"></div></div>
<div id="hdr"><img id="hlogo" src="logo_color.png"><div id="pill">◉ USP MATERIAL TALKS</div><div id="hline"></div><div id="prog"></div></div>
<div id="stage"></div>
<div id="cap"></div>
<svg id="masc" viewBox="0 0 190 220"></svg>
<script>
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c=1.6;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const words=(t,cls)=>esc(t).split(/\s+/).filter(Boolean).map(w=>`<span class="w${cls?' '+cls:''}">${w}</span>`).join(' ');
function rng(seed){let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>(s=s*16807%2147483647)/2147483647;}

/* ---------- small line icons ---------- */
const I={check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
 temp:'<path d="M10 14.5V5a2 2 0 014 0v9.5a4 4 0 11-4 0z"/><path d="M12 9v7"/>',
 link:'<path d="M10 14a4.5 4.5 0 006.4 0l3-3a4.5 4.5 0 00-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 00-6.4 0l-3 3a4.5 4.5 0 006.4 6.4l1-1"/>',
 palette:'<path d="M12 3a9 9 0 100 18c1.2 0 1.8-.8 1.8-1.7 0-1.3-1.1-1.6-1.1-2.7 0-1 .8-1.6 1.8-1.6H17a4 4 0 004-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
 shield:'<path d="M12 3l7 3v5.5c0 4.5-3 8-7 9.5-4-1.5-7-5-7-9.5V6z"/><path d="M8.8 12l2.2 2.2 4.2-4.4"/>',
 leaf:'<path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/>',drop:'<path d="M12 3.5s6 6.6 6 10.5a6 6 0 01-12 0c0-3.9 6-10.5 6-10.5z"/>',
 gauge:'<path d="M4.5 16a8 8 0 1115 0"/><path d="M12 13l4-4"/><circle cx="12" cy="13" r="1.3"/>',percent:'<path d="M18 6L6 18"/><circle cx="7.5" cy="7.5" r="2.2"/><circle cx="16.5" cy="16.5" r="2.2"/>',
 layers:'<path d="M12 4l8 4-8 4-8-4z"/><path d="M4 12l8 4 8-4"/><path d="M4 16l8 4 8-4"/>',flask:'<path d="M9.5 3.5h5M10 3.5v6L5 18.5A1.6 1.6 0 006.4 21h11.2a1.6 1.6 0 001.4-2.5L14 9.5v-6"/><path d="M7.5 15h9"/>',
 bolt:'<path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/>',clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',star:'<path d="M12 4l2.5 5 5.5.8-4 3.9.9 5.5L12 16.6 7.1 19.2l.9-5.5-4-3.9 5.5-.8z"/>'};
function iconFor(t){t=String(t).toLowerCase();const m=[[/temp|heat|°|cold|weather|uv/,'temp'],[/bond|adhes|overmo|pp|abs|nylon|substrat/,'link'],[/colou?r|shade|tint|pigment/,'palette'],[/food|fda|rohs|reach|safe|certif|complian|medical/,'shield'],[/eco|recycl|green|sustain|phthal|bio/,'leaf'],[/oil|water|chemic|resist/,'drop'],[/hard|shore|soft|flex/,'gauge'],[/reject|%|percent|yield|scrap/,'percent'],[/grade|layer|compound|blend/,'layers'],[/lab|test|trial|sample/,'flask'],[/fast|cycle|speed|quick/,'bolt'],[/time|deliver|lead|day|week/,'clock'],[/qualit|premium|feel|touch|grip/,'star']];for(const [r,k] of m)if(r.test(t))return k;return 'check';}
const icon=k=>'<svg viewBox="0 0 24 24">'+(I[k]||I.check)+'</svg>';

/* ---------- soft 3D illustrations (drawn in code, brand colours) ---------- */
const COL={o:['#FFB46B','#F38620','#C9620E'],s:['#8593A0','#4A5663','#2A323A'],w:['#FFFFFF','#E9EDF0','#BCC6CE'],k:['#5A626B','#2F353C','#16191D'],r:['#FF8A65','#E0582B','#B23C17']};
let GID=0;
function grad(c,dir){const id='lgr'+(GID++);return {id,def:`<linearGradient id="${id}" x1="0" y1="0" x2="${dir==='h'?1:0}" y2="${dir==='h'?0:1}"><stop offset="0" stop-color="${COL[c][0]}"/><stop offset="0.55" stop-color="${COL[c][1]}"/><stop offset="1" stop-color="${COL[c][2]}"/></linearGradient>`};}
function pellet(x,y,s,c,rot,attrs){const g=grad(c);return `<defs>${g.def}</defs><g ${attrs||''}><g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><rect x="-17" y="-12" width="34" height="24" rx="12" fill="url(#${g.id})"/><ellipse cx="-5" cy="-5" rx="8" ry="3.6" fill="#fff" opacity="0.55"/></g></g>`;}
function base(w,y){return `<ellipse cx="300" cy="${y||400}" rx="${w||230}" ry="26" fill="#2A323A" opacity="0.08"/><circle cx="300" cy="230" r="215" fill="#FFF3E6" opacity="0.9"/><circle cx="300" cy="230" r="215" fill="none" stroke="#FBE0C6" stroke-width="2"/>`;}
const VIS={
 granules(){const r=rng(7);let h=base(250,402);const cs=['o','o','o','s','w','k','o','s'];let pile='';
   let i=0;for(let row=0;row<7;row++){const y=392-row*21;const half=205-row*30;for(let x=300-half;x<=300+half;x+=27+r()*6){pile+=pellet(x+(r()*10-5),y+(r()*8-4),1.1+r()*0.2,cs[(i++)%cs.length],r()*180);}}
   let fall='';for(let i=0;i<5;i++){fall+=pellet(250+i*28,-60,1.2,cs[i],r()*180,`data-fall="${(0.5+i*0.32).toFixed(2)}" data-to="${(250-i*14)}"`);}
   return h+`<g data-pop="0.2">${pile}</g>`+fall;},
 chips(){let h=base(230,405);const cs=['k','s','w','o'];const lab=['80 A','60 A','30 A','0 A'];let c='';
   cs.forEach((k,i)=>{const g=grad(k);const rot=-39+i*26;c+=`<defs>${g.def}</defs><g data-pop="${(0.25+i*0.18).toFixed(2)}"><g transform="rotate(${rot} 300 390)" ${i===3?'data-bend="1"':''}><rect x="232" y="120" width="136" height="250" rx="26" fill="url(#${g.id})" stroke="rgba(0,0,0,0.06)"/><rect x="250" y="138" width="40" height="10" rx="5" fill="#fff" opacity="0.5"/><text x="300" y="345" text-anchor="middle" font-family="JBMono" font-weight="700" font-size="22" fill="${k==='w'?'#4A5663':'#fff'}" opacity="0.9">${lab[i]}</text></g></g>`;});
   return h+c;},
 gauge(){let h=base(220,400);const g=grad('o','h');let ticks='';for(let i=0;i<=10;i++){const a=Math.PI*(1-i/10);ticks+=`<line x1="${300+Math.cos(a)*150}" y1="${300-Math.sin(a)*150}" x2="${300+Math.cos(a)*(i%5?165:175)}" y2="${300-Math.sin(a)*(i%5?165:175)}" stroke="#4A5663" stroke-width="${i%5?3:5}" stroke-linecap="round"/>`;}
   return h+`<defs>${g.def}</defs><g data-pop="0.2"><path d="M 90 300 A 210 210 0 0 1 510 300" fill="none" stroke="#E9EDF0" stroke-width="34" stroke-linecap="round"/><path d="M 90 300 A 210 210 0 0 1 510 300" fill="none" stroke="url(#${g.id})" stroke-width="34" stroke-linecap="round" data-arc="1" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>${ticks}
   <text x="120" y="350" font-family="JBMono" font-weight="700" font-size="20" fill="#7A8791">0 A</text><text x="430" y="350" font-family="JBMono" font-weight="700" font-size="20" fill="#7A8791">60 D</text>
   <g data-needle="1" style="transform-origin:300px 300px"><path d="M300 288 L470 300 L300 312 Z" fill="#2A323A"/></g><circle cx="300" cy="300" r="26" fill="#2A323A"/><circle cx="300" cy="300" r="10" fill="#F38620"/>
   <rect x="225" y="350" width="150" height="44" rx="22" fill="#2A323A"/><text x="300" y="380" text-anchor="middle" font-family="JBMono" font-weight="700" font-size="20" fill="#fff">SHORE</text></g>`;},
 grip(){let h=base(240,400);const hard=grad('w'),soft=grad('o'),metal=grad('s');let ridges='';for(let i=0;i<9;i++)ridges+=`<rect x="${245+i*22}" y="196" width="9" height="78" rx="4.5" fill="#C9620E" opacity="0.55"/>`;
   return h+`<defs>${hard.def}${soft.def}${metal.def}</defs><g data-pop="0.2"><g transform="rotate(-18 300 235)"><rect x="40" y="222" width="150" height="26" rx="8" fill="url(#${metal.id})"/><rect x="170" y="182" width="330" height="106" rx="53" fill="url(#${hard.id})" stroke="#D5DCE1" stroke-width="2"/>
   <g data-grip="1"><rect x="225" y="174" width="230" height="122" rx="50" fill="url(#${soft.id})"/>${ridges}<ellipse cx="300" cy="190" rx="60" ry="8" fill="#fff" opacity="0.4"/></g></g></g>
   <g data-pop="1.2"><rect x="372" y="64" width="150" height="46" rx="23" fill="#2A323A"/><text x="447" y="94" text-anchor="middle" font-family="JBMono" font-weight="700" font-size="19" fill="#fff">BONDED</text></g>`;},
 machine(){let h=base(260,402);const body=grad('s'),barrel=grad('w'),mould=grad('k'),part=grad('o');let bands='';for(let i=0;i<4;i++)bands+=`<rect x="${190+i*50}" y="232" width="26" height="70" rx="6" fill="#F38620"/>`;let pel='';const r=rng(3);for(let i=0;i<7;i++)pel+=pellet(150+r()*60,160+r()*14,0.8,['o','s','k'][i%3],r()*180);
   let fall='';for(let i=0;i<4;i++)fall+=pellet(175+i*12,-60,0.9,['o','s','o','k'][i],i*40,`data-fall="${(0.4+i*0.35).toFixed(2)}" data-to="${150}" data-loop="1.4"`);
   return h+`<defs>${body.def}${barrel.def}${mould.def}${part.def}</defs><g data-pop="0.15"><path d="M110 90 L250 90 L210 200 L150 200 Z" fill="url(#${barrel.id})" stroke="#D5DCE1" stroke-width="2"/>${pel}
   <rect x="150" y="240" width="250" height="54" rx="27" fill="url(#${barrel.id})" stroke="#D5DCE1" stroke-width="2"/>${bands}<rect x="160" y="200" width="50" height="44" fill="url(#${barrel.id})"/>
   <rect x="400" y="190" width="70" height="160" rx="10" fill="url(#${mould.id})"/><rect x="474" y="190" width="70" height="160" rx="10" fill="url(#${mould.id})" data-mould="1"/>
   <rect x="80" y="320" width="470" height="44" rx="14" fill="url(#${body.id})"/></g>
   <g data-part="1"><rect x="470" y="250" width="70" height="40" rx="20" fill="url(#${part.id})"/></g>`+fall;},
 lab(){let h=base(240,400);const glass='rgba(255,255,255,0.55)';const liq=grad('o');let dish='';const r=rng(11);for(let i=0;i<9;i++)dish+=pellet(415+r()*70-35,322+r()*16-8,0.75,['o','s','w','k'][i%4],r()*180);
   return h+`<defs>${liq.def}<clipPath id="fl"><path d="M235 80 L285 80 L285 170 L355 330 Q362 352 338 352 L182 352 Q158 352 165 330 L235 170 Z"/></clipPath></defs>
   <g data-pop="0.2"><g clip-path="url(#fl)"><rect x="150" y="200" width="220" height="170" fill="url(#${liq.id})" data-liquid="1"/></g><path d="M235 80 L285 80 L285 170 L355 330 Q362 352 338 352 L182 352 Q158 352 165 330 L235 170 Z" fill="${glass}" stroke="#AEB9C2" stroke-width="5" stroke-linejoin="round"/><rect x="226" y="68" width="68" height="18" rx="9" fill="#AEB9C2"/></g>
   <g data-bub="1"><circle cx="240" cy="300" r="8" fill="#fff" opacity="0.7"/><circle cx="270" cy="320" r="5" fill="#fff" opacity="0.7"/><circle cx="290" cy="290" r="6" fill="#fff" opacity="0.7"/></g>
   <g data-pop="0.7"><ellipse cx="415" cy="335" rx="85" ry="26" fill="#fff" stroke="#AEB9C2" stroke-width="4"/>${dish}</g>
   <g data-pop="1.0"><rect x="95" y="190" width="34" height="150" rx="17" fill="${glass}" stroke="#AEB9C2" stroke-width="4"/><rect x="99" y="270" width="26" height="66" rx="13" fill="#4A5663"/></g>`;},
 shield(){let h=base(220,402);const g=grad('o');const bad=(x,y,t,d)=>`<g data-pop="${d}"><circle cx="${x}" cy="${y}" r="46" fill="#fff" stroke="#F7CDA6" stroke-width="4"/><text x="${x}" y="${y+8}" text-anchor="middle" font-family="JBMono" font-weight="700" font-size="${t.length>4?17:21}" fill="#2A323A">${t}</text></g>`;
   return h+`<defs>${g.def}</defs><g data-pop="0.2"><path d="M300 60 L430 110 L430 220 Q430 320 300 372 Q170 320 170 220 L170 110 Z" fill="url(#${g.id})"/><path d="M300 92 L402 132 L402 220 Q402 298 300 340 Q198 298 198 220 L198 132 Z" fill="#fff" opacity="0.18"/><path d="M245 215 L285 255 L360 175" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" data-draw="1" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></g>`+bad(110,150,'FDA',0.8)+bad(492,150,'RoHS',1.0)+bad(492,300,'REACH',1.2)+bad(110,300,'UL 94',1.4);},
 product(){let h=base(240,402);const body=grad('w'),soft=grad('o'),br=grad('s');let bristles='';for(let i=0;i<7;i++)bristles+=`<rect x="${398+i*13}" y="128" width="8" height="38" rx="4" fill="${i%2?'#7FC8E8':'#fff'}" stroke="#D5DCE1" stroke-width="1.5"/>`;let pel='';const r=rng(5);for(let i=0;i<12;i++)pel+=pellet(130+r()*110,340+r()*40,0.85,['o','o','s','w'][i%4],r()*180);
   return h+`<defs>${body.def}${soft.def}${br.def}</defs><g data-pop="0.6"><g transform="rotate(-24 300 230)"><rect x="110" y="166" width="400" height="60" rx="30" fill="url(#${body.id})" stroke="#D5DCE1" stroke-width="2"/><rect x="390" y="160" width="110" height="20" rx="10" fill="url(#${br.id})"/>${bristles}
   <rect x="140" y="160" width="150" height="72" rx="36" fill="url(#${soft.id})"/><rect x="160" y="172" width="110" height="10" rx="5" fill="#fff" opacity="0.4"/></g></g><g data-pop="0.2">${pel}</g>`;},
 question(){let h=base(230,400);const g=grad('o');
   return h+`<defs>${g.def}</defs><g data-pop="0.2" data-float="1"><path d="M170 120 Q170 80 210 80 L390 80 Q430 80 430 120 L430 250 Q430 290 390 290 L290 290 L235 340 L245 290 L210 290 Q170 290 170 250 Z" fill="url(#${g.id})"/><text x="300" y="235" text-anchor="middle" font-family="Rubik" font-weight="700" font-size="150" fill="#fff">?</text></g>
   <g data-pop="0.6" data-float="2"><rect x="60" y="120" width="90" height="64" rx="14" fill="#fff" stroke="#E3E8EB" stroke-width="3" transform="rotate(-12 105 152)"/></g><g data-pop="0.8" data-float="3"><rect x="455" y="190" width="80" height="58" rx="14" fill="#4A5663" transform="rotate(10 495 219)"/></g><circle cx="470" cy="100" r="10" fill="#F38620" data-pop="1.0"/>`;},
 problem(){let h=base(240,400);const hard=grad('w'),soft=grad('o');
   return h+`<defs>${hard.def}${soft.def}</defs><g data-pop="0.2"><g transform="rotate(-18 300 235)"><rect x="140" y="182" width="360" height="106" rx="53" fill="url(#${hard.id})" stroke="#D5DCE1" stroke-width="2"/><rect x="200" y="174" width="180" height="122" rx="50" fill="url(#${soft.id})"/>
   <g data-peel="1" style="transform-origin:380px 176px"><path d="M380 176 Q430 150 460 110 L470 150 Q430 190 380 222 Z" fill="#C9620E"/></g><path d="M250 200 l20 18 l-14 14 l22 20" fill="none" stroke="#7A3A08" stroke-width="5" stroke-linecap="round"/></g></g>
   <g data-pop="1.0"><circle cx="470" cy="95" r="44" fill="#E0582B"/><rect x="465" y="65" width="10" height="38" rx="5" fill="#fff"/><circle cx="470" cy="118" r="6" fill="#fff"/></g>`;},
 truck(){let h=base(260,402);const body=grad('w'),cab=grad('o');
   return h+`<defs>${body.def}${cab.def}</defs><g data-drive="1"><rect x="90" y="170" width="290" height="170" rx="18" fill="url(#${body.id})" stroke="#D5DCE1" stroke-width="2"/><text x="235" y="268" text-anchor="middle" font-family="JBMono" font-weight="700" font-size="26" fill="#4A5663">PAN-INDIA</text>
   <path d="M385 215 L470 215 L520 270 L520 340 L385 340 Z" fill="url(#${cab.id})"/><path d="M400 230 L462 230 L498 268 L400 268 Z" fill="#fff" opacity="0.6"/>
   <circle cx="170" cy="345" r="34" fill="#2A323A"/><circle cx="170" cy="345" r="13" fill="#AEB9C2"/><circle cx="450" cy="345" r="34" fill="#2A323A"/><circle cx="450" cy="345" r="13" fill="#AEB9C2"/></g>`;},
 chart(){let h=base(220,402);let bars='';[90,150,200,270].forEach((v,i)=>{const g=grad(i===3?'o':'s');bars+=`<defs>${g.def}</defs><rect x="${150+i*80}" y="${370-v}" width="56" height="${v}" rx="12" fill="url(#${g.id})" data-bar="${(0.3+i*0.2).toFixed(2)}" style="transform-origin:${178+i*80}px 370px"/>`;});
   return h+bars+`<path d="M150 260 L230 220 L310 170 L400 90" fill="none" stroke="#F38620" stroke-width="7" stroke-linecap="round" data-draw="1" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/>`;}
};
function visFor(s){if(s.visual&&VIS[s.visual])return s.visual;const t=[s.line1,s.line2,s.caption,s.title,s.voice,s.background_word].join(' ').toLowerCase();
 const m=[[/peel|crack|sticky|fail|slip|break|complain|problem|wrong/,'problem'],[/dispatch|deliver|pan-india|supply|ship/,'truck'],[/fda|food|rohs|reach|certif|complian|medical|safe/,'shield'],[/bond|overmou?ld|overmo/,'grip'],[/hardness|shore|\bsoft\b|softness/,'gauge'],[/mou?lding|injection|extrusion|machine|production|process|cycle/,'machine'],[/\blab\b|r&d|research|test/,'lab'],[/colou?r|sample|chip|trial|\bcustomi[sz]|\bcustom\b/,'chips'],[/toothbrush|razor|pen|everyday|handle|product/,'product'],[/grow|customers|clients|trust|kg|supplied/,'chart'],[/\?|why|how|what/,'question'],[/granule|pellet|compound|material|tpe|tpv|tpu/,'granules']];
 for(const [r,k] of m)if(r.test(t))return k;return 'granules';}
function visual(s){return `<svg viewBox="0 0 600 440" width="720" height="528">${VIS[visFor(s)]()}</svg>`;}

/* ---------- mascot: Gummy, an orange TPE granule ---------- */

 <ellipse cx="95" cy="210" rx="56" ry="9" fill="#2A323A" opacity="0.12"/>
 <g id="mbody"><g id="armL"><path d="M38 128 Q14 138 12 160" fill="none" stroke="#D2690F" stroke-width="11" stroke-linecap="round"/><circle cx="12" cy="162" r="9" fill="#F38620"/></g>
 <g id="armR" style="transform-origin:152px 128px"><path d="M152 128 Q176 138 178 160" fill="none" stroke="#D2690F" stroke-width="11" stroke-linecap="round"/><circle cx="178" cy="162" r="9" fill="#F38620"/></g>
 <rect x="62" y="186" width="20" height="18" rx="8" fill="#C9620E"/><rect x="108" y="186" width="20" height="18" rx="8" fill="#C9620E"/>
 <rect x="35" y="40" width="120" height="155" rx="56" fill="url(#mb)"/><ellipse cx="72" cy="68" rx="22" ry="9" fill="#fff" opacity="0.45" transform="rotate(-20 72 68)"/>
 <g id="eyes" style="transform-origin:95px 100px"><ellipse cx="74" cy="100" rx="15" ry="18" fill="#fff"/><ellipse cx="116" cy="100" rx="15" ry="18" fill="#fff"/><circle id="pl" cx="76" cy="103" r="8" fill="#2A323A"/><circle id="pr" cx="118" cy="103" r="8" fill="#2A323A"/><circle cx="79" cy="99" r="2.6" fill="#fff"/><circle cx="121" cy="99" r="2.6" fill="#fff"/></g>
 <g class="mood" data-m="happy"><path d="M78 136 Q95 152 112 136" fill="none" stroke="#2A323A" stroke-width="5" stroke-linecap="round"/></g>
 <g class="mood" data-m="wave"><path d="M76 134 Q95 156 114 134 Z" fill="#2A323A"/></g>
 <g class="mood" data-m="thumbs"><path d="M78 136 Q95 152 112 136" fill="none" stroke="#2A323A" stroke-width="5" stroke-linecap="round"/></g>
 <g class="mood" data-m="surprised"><ellipse cx="95" cy="142" rx="9" ry="11" fill="#2A323A"/><path d="M60 74 Q74 64 88 72 M102 72 Q116 64 130 74" fill="none" stroke="#2A323A" stroke-width="4" stroke-linecap="round"/></g>
 <g class="mood" data-m="worried"><path d="M80 146 Q95 134 110 146" fill="none" stroke="#2A323A" stroke-width="5" stroke-linecap="round"/><path d="M62 80 Q74 72 86 78 M104 78 Q116 72 128 80" fill="none" stroke="#2A323A" stroke-width="4" stroke-linecap="round"/></g>
 <g class="mood" data-m="thinking"><path d="M84 140 L106 136" fill="none" stroke="#2A323A" stroke-width="5" stroke-linecap="round"/><g><circle cx="168" cy="40" r="20" fill="#fff" stroke="#E3E8EB" stroke-width="3"/><text x="168" y="50" text-anchor="middle" font-family="Rubik" font-weight="700" font-size="26" fill="#F38620">?</text><circle cx="148" cy="68" r="6" fill="#fff" stroke="#E3E8EB" stroke-width="2"/></g></g>
 <g id="thumb" style="display:none"><rect x="168" y="138" width="22" height="26" rx="8" fill="#F38620"/><rect x="175" y="122" width="9" height="22" rx="4.5" fill="#F38620"/></g></g>`;}

const DEF_KICK={reviews:'What buyers say',checklist:'What to check',spec_card:'The specs',compare:'Side by side',big_number:'The proof'};
const DEF_MASCOT={reviews:'worried',big_number:'happy',end_card:'wave'};
let BT=0;
function headline(a,b){return `<div class="h" data-rv>${words(a)}${b?' '+words(b,'a'):''}</div>`;}
function kick(s,def){const k=s.kicker||def;return k?`<div class="kick" data-kk>${esc(k)}</div>`:'';}
const BUILD={
 big_text(s){const n=BT++;const def=/\?/.test((s.line1||'')+(s.line2||''))?'Quick question':(n===0?'Why it matters':'The insight');
   return `<div class="col">${kick(s,def)}${headline(s.line1,s.line2)}<div class="vis" data-vis>${visual(s)}</div></div>`;},
 big_number(s){const m=String(s.number||'').match(/^(\D*)([\d.,]+)(.*)$/);
   return `<div class="col">${kick(s,DEF_KICK.big_number)}<div class="vis" style="flex-direction:column;padding-bottom:200px"><div style="position:relative;display:flex;align-items:center;justify-content:center">
   <div data-ring style="position:absolute;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#FFF3E6 0%,#FFF3E6 60%,rgba(255,243,230,0) 71%)"></div>
   <div class="h" data-num data-pre="${esc(m?m[1]:'')}" data-val="${m?m[2].replace(/,/g,''):''}" data-suf="${esc(m?m[3]:s.number)}" style="position:relative;font-size:220px;color:var(--o);margin:0;line-height:1">${esc(s.number)}</div></div>
   <div class="h" data-rv style="font-size:60px;margin-top:40px;max-width:820px">${words(s.line1)}</div></div></div>`;},
 reviews(s){const nm=['R','A','S'];const it=(s.items||[]).slice(0,3).map((x,k)=>`<div data-item class="card" style="position:relative;display:flex;gap:22px;align-items:center;text-align:left;padding:26px 30px;margin-top:22px;border-radius:24px">
    <div class="ico" style="width:62px;height:62px;background:${['#C9D1D7','#B0BEC5','#D5DCE1'][k]};color:#fff;font-weight:700;font-size:28px">${nm[k]}</div>
    <div style="flex:1"><div class="stars">${'★'.repeat(k%2?1:2)}<span>${'★'.repeat(k%2?4:3)}</span></div><div style="font-size:33px;font-weight:700;margin-top:4px;line-height:1.25">${esc(x)}</div></div>
    <div data-x class="ico" style="width:56px;height:56px;background:#E0582B;color:#fff;opacity:0">${icon('x')}</div></div>`).join('');
   return `<div class="col">${kick(s,s.title||DEF_KICK.reviews)}${headline(s.caption||'')}<div class="vis" style="display:block;padding-top:40px;width:900px">${it}</div></div>`;},
 checklist(s){const it=(s.items||[]).slice(0,4).map(x=>`<div data-item style="display:flex;gap:24px;align-items:center;text-align:left;padding:26px 0;border-bottom:2px solid var(--line)">
    <div class="ico" style="width:62px;height:62px;background:#FFF1E4;color:var(--o)">${icon(iconFor(x))}</div><div style="font-size:35px;font-weight:700;line-height:1.2;flex:1">${esc(x)}</div>
    <div class="ico" data-ck style="width:46px;height:46px;background:var(--o);color:#fff;transform:scale(0)">${icon('check')}</div></div>`).join('');
   return `<div class="col">${kick(s,s.title||DEF_KICK.checklist)}${headline(s.caption||s.title||'')}<div class="vis" style="display:block;padding-top:44px;width:900px"><div class="card" data-card style="padding:14px 40px">${it}</div></div></div>`;},
 spec_card(s){const it=(s.items||[]).slice(0,4).map(x=>{const p=String(x).split(':');const l=p.shift();const v=p.join(':').trim();const shore=/shore/i.test(v);
   return `<div data-item style="padding:26px 0;border-bottom:2px solid var(--line);text-align:left"><div style="display:flex;gap:22px;align-items:center">
    <div class="ico" style="width:58px;height:58px;background:#FFF1E4;color:var(--o)">${icon(iconFor(l+' '+v))}</div><div class="tag" style="font-size:20px;color:#4A5663">${esc(l)}</div>
    <div style="margin-left:auto;padding:10px 20px;border-radius:999px;background:#FFF1E4;color:#C9620E;font-size:28px;font-weight:700">${esc(v)}</div></div>
    ${shore?'<div style="position:relative;height:12px;border-radius:6px;background:#EEF1F3;margin:24px 0 6px 80px"><div data-fill style="position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:linear-gradient(90deg,#FFC48A,#F38620)"></div><div data-knob style="position:absolute;top:-11px;left:0;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:#fff;border:6px solid #F38620"></div></div>':''}</div>`}).join('');
   return `<div class="col">${kick(s,s.title||DEF_KICK.spec_card)}${headline(s.caption||'')}<div class="vis" style="display:block;padding-top:44px;width:900px"><div class="card" data-card style="padding:14px 40px">${it}</div></div></div>`;},
 compare(s){const col=(t,items,good)=>`<div data-col style="flex:1;border-radius:28px;padding:36px 30px;text-align:left;background:${good?'#fff':'#F2F4F6'};${good?'box-shadow:0 26px 60px rgba(243,134,32,0.20);border:3px solid var(--o)':'border:3px solid transparent'}">
    <div class="tag" style="color:${good?'var(--od)':'var(--muted)'};font-size:21px;margin-bottom:14px">${esc(t)}</div>
    ${(items||[]).slice(0,3).map(x=>`<div data-ci style="display:flex;gap:16px;align-items:center;padding:20px 0;font-size:32px;font-weight:700;line-height:1.2;color:${good?'var(--s)':'#8C99A5'}"><div class="ico" style="width:48px;height:48px;background:${good?'var(--o)':'#C3CCD3'};color:#fff">${icon(good?'check':'x')}</div><div>${esc(x)}</div></div>`).join('')}</div>`;
   return `<div class="col">${kick(s,DEF_KICK.compare)}${headline(s.line1)}<div class="vis" style="display:block;padding-top:50px;width:940px"><div style="position:relative;display:flex;gap:28px;align-items:stretch">${col(s.left_title,s.left_items,false)}${col(s.right_title,s.right_items,true)}
   <div data-vs class="ico" style="position:absolute;left:50%;top:50%;margin:-44px 0 0 -44px;width:88px;height:88px;background:#2A323A;color:#fff;font-family:'JBMono';font-weight:700;font-size:26px;border:6px solid #fff">VS</div></div></div></div>`;},
 end_card(s){return `<div class="col" style="justify-content:center;padding-bottom:200px"><img data-logo src="logo_color.png" style="width:330px">
   <div data-e1 style="margin-top:70px;padding:28px 54px;border-radius:999px;background:var(--o);color:#fff;font-weight:700;font-size:40px;box-shadow:0 20px 50px rgba(243,134,32,0.35)">Request a free trial sample →</div>
   <div data-e2 style="margin-top:36px;font-size:40px;font-weight:700">usppolymers.in</div>
   <div data-e3 class="tag" style="margin-top:56px;font-size:22px;color:#55626D">Everyday Life. Connected by <span style="color:var(--o)">Polymers.</span></div></div>`;}
};

let SC=[],WORDS=[],TOTAL=0,CHUNKS=[],M=null;
function setup(script){
  const st=document.getElementById('stage');st.innerHTML='';SC=[];BT=0;GID=0;
  if(script.series)document.getElementById('pill').textContent='◉ '+String(script.series).toUpperCase();
  document.getElementById('masc').innerHTML=mascotSVG();
  script.scenes.forEach((s,i)=>{const f=BUILD[s.type]||BUILD.big_text;const d=document.createElement('div');d.className='scene';d.innerHTML=f(s);st.appendChild(d);
    const mood=(s.mascot!==undefined&&s.mascot!==null&&s.mascot!=='')?String(s.mascot).toLowerCase():(DEF_MASCOT[s.type]||'none');
    SC.push({el:d,s,type:s.type,start:s.start,dur:s.duration,mood,q:k=>d.querySelector(k),qa:k=>[...d.querySelectorAll(k)]});});
  TOTAL=script.total;WORDS=script.words||[];
  CHUNKS=[];let cur=[];WORDS.forEach((w,k)=>{cur.push(w);const nx=WORDS[k+1];if(/[.!?,;:]$/.test(w.text)&&cur.length>=3||cur.length>=5||!nx||nx.scene!==w.scene){CHUNKS.push(cur);cur=[];}});
  return TOTAL;
}
function reveal(el,lt,start,span){if(!el)return;const ws=el.querySelectorAll('.w');const n=ws.length;ws.forEach((w,k)=>{const p=ease((lt-start-(n>1?k*span/n:0))/0.45);w.style.opacity=p;w.style.transform='translateY('+((1-p)*28)+'px)';});}
function rise(el,lt,start,dur,dist){if(!el)return 0;const p=ease((lt-start)/(dur||0.5));el.style.opacity=p;el.style.transform='translateY('+((1-p)*(dist||36))+'px)';return p;}
function popEl(el,lt,start){const p=clamp((lt-start)/0.55);el.style.opacity=clamp(p*2.5);el.style.transformBox='fill-box';el.style.transformOrigin='center';el.style.transform='scale('+(0.82+0.18*back(p))+')';}
const FADE=0.4;
function animVis(q,qa,lt,D){
  qa('[data-pop]').forEach(e=>popEl(e,lt,parseFloat(e.dataset.pop)));
  qa('[data-fall]').forEach(e=>{const d=parseFloat(e.dataset.fall),to=parseFloat(e.dataset.to),loop=parseFloat(e.dataset.loop||0);let x=lt-d;if(loop&&x>0)x=x%loop;const p=clamp(x/0.7);const y=-60+(to+60)*(p*p);e.style.transform=e.getAttribute('transform')?'':'';e.setAttribute('opacity',x<0?0:(loop&&p>=1?0:1));e.style.transform=`translateY(${y+60}px)`;});
  qa('[data-float]').forEach(e=>{const k=parseFloat(e.dataset.float);e.style.transform=(e.style.transform||'')+` translateY(${Math.sin(lt*1.4+k)*8}px)`;});
  qa('[data-bend]').forEach(e=>{e.style.transformBox='fill-box';e.style.transformOrigin='50% 100%';e.style.transform=`rotate(${Math.sin(Math.max(0,lt-1.2)*2.2)*9*clamp(lt-1.2)}deg)`;});
  qa('[data-needle]').forEach(e=>{const p=easeIO((lt-0.8)/1.8);const a=-180+p*150+Math.sin(lt*3)*2*clamp(lt-2.6);e.style.transform=`rotate(${a}deg)`;});
  qa('[data-arc]').forEach(e=>{e.setAttribute('stroke-dashoffset',100-easeIO((lt-0.8)/1.8)*83);});
  qa('[data-draw]').forEach(e=>{e.setAttribute('stroke-dashoffset',100-ease((lt-0.9)/0.9)*100);});
  qa('[data-grip]').forEach(e=>{e.style.transformBox='fill-box';e.style.transformOrigin='center';const p=back((lt-0.6)/0.6);e.style.transform=`translateY(${(1-clamp((lt-0.6)/0.6))*-120}px) scale(${0.9+0.1*p})`;e.style.opacity=clamp((lt-0.6)/0.25);});
  qa('[data-peel]').forEach(e=>{e.style.transform=`rotate(${-6+Math.sin(lt*2.4)*8}deg)`;});
  qa('[data-mould]').forEach(e=>{const c=(lt%3)/3;const open=c<0.5?0:Math.sin((c-0.5)*2*Math.PI)*40;e.style.transform=`translateX(${Math.max(0,open)}px)`;});
  qa('[data-part]').forEach(e=>{const c=(lt%3)/3;const p=c<0.6?0:clamp((c-0.6)/0.3);e.style.opacity=c<0.55?0:1;e.style.transform=`translate(${p*60}px,${p*90}px)`;});
  qa('[data-liquid]').forEach(e=>{e.style.transform=`translateY(${Math.sin(lt*1.5)*5}px)`;});
  qa('[data-bub]').forEach(e=>{e.style.transform=`translateY(${-((lt*40)%90)}px)`;e.style.opacity=0.4+0.6*Math.abs(Math.sin(lt*2));});
  qa('[data-drive]').forEach(e=>{const p=ease((lt-0.2)/1.0);e.style.transform=`translateX(${(1-p)*-500+Math.sin(lt*10)*1.2}px)`;e.style.opacity=clamp((lt-0.2)/0.3);});
  qa('[data-bar]').forEach(e=>{const p=back((lt-parseFloat(e.dataset.bar))/0.6);e.style.transform=`scaleY(${Math.max(0,p)})`;});
}
function render(t){
  let cur=SC[SC.length-1];
  SC.forEach((s,idx)=>{const a=s.start,b=s.start+s.dur,last=idx===SC.length-1;
    if(t>=a&&t<b)cur=s;
    let o=0;if(t>=a&&(t<b||last))o=idx===0?1:clamp((t-a)/FADE);else if(t>=b&&t<b+FADE)o=1-clamp((t-b)/FADE);
    s.el.style.opacity=o;s.el.style.visibility=o>0?'visible':'hidden';if(o<=0)return;
    const lt=t-a,D=s.dur,q=s.q,qa=s.qa;
    rise(q('[data-kk]'),lt,0.05,0.45,16);
    if(s.type==='big_number'){const n=q('[data-num]');const v=parseFloat(n.dataset.val);const p=ease((lt-0.3)/1.3);
      if(!isNaN(v)){const dec=(n.dataset.val.split('.')[1]||'').length;n.textContent=n.dataset.pre+(v*p).toFixed(dec).replace(/\B(?=(\d{3})+(?!\d))/g,dec?'':',')+n.dataset.suf;}
      n.style.opacity=clamp((lt-0.2)/0.3);n.style.transform='scale('+(0.85+0.15*back((lt-0.2)/0.7))+')';
      const r=q('[data-ring]');r.style.transform='scale('+(0.7+0.3*ease(lt/1.0))+')';r.style.opacity=ease(lt/1.0);
      reveal(q('[data-rv]'),lt,0.9,0.7);}
    else if(s.type==='end_card'){const l=q('[data-logo]');l.style.opacity=ease((lt-0.1)/0.6);l.style.transform='scale('+(0.88+0.12*back((lt-0.1)/0.7))+')';
      rise(q('[data-e1]'),lt,0.7,0.5);rise(q('[data-e2]'),lt,1.1,0.5);rise(q('[data-e3]'),lt,1.5,0.6);}
    else{reveal(q('[data-rv]'),lt,0.15,Math.min(1.1,D*0.22));
      animVis(q,qa,lt,D);
      const card=q('[data-card]');if(card)rise(card,lt,0.45,0.6,60);
      const its=qa('[data-item]');const span=Math.max(1.1,D*0.5);
      its.forEach((it,k)=>{const st=0.75+k*span/Math.max(1,its.length);rise(it,lt,st,0.45,s.type==='reviews'?50:26);
        const ck=it.querySelector('[data-ck]');if(ck)ck.style.transform='scale('+back((lt-st-0.3)/0.4)+')';
        const f=it.querySelector('[data-fill]');if(f){const h=easeIO((lt-st-0.2)/1.4)*0.82;f.style.width=(h*100)+'%';it.querySelector('[data-knob]').style.left=(h*100)+'%';}});
      qa('[data-x]').forEach((x,k)=>{const st=0.75+span+0.15+k*0.25;x.style.opacity=clamp((lt-st)/0.15);x.style.transform='scale('+back((lt-st)/0.4)+')';});
      const cols=qa('[data-col]');cols.forEach((c,k)=>rise(c,lt,0.5+k*0.35,0.5,40));
      if(cols.length){const vs=q('[data-vs]');vs.style.transform='scale('+back((lt-1.1)/0.45)+')';const n0=cols[0].querySelectorAll('[data-ci]').length;const gap=Math.max(0.9,D*0.3);
        qa('[data-ci]').forEach((c,k)=>{const col=k<n0?0:1;const kk=col?k-n0:k;rise(c,lt,1.0+col*gap+kk*0.3,0.35,16);});
        cols[1].style.transform='translateY(0) scale('+(1+0.025*ease((lt-1.0-gap)/0.5))+')';}}
  });
  // header: progress line, logo hidden on the end card (the big logo is there)
  document.getElementById('prog').style.width=(clamp(t/TOTAL)*940)+'px';
  const hl=document.getElementById('hlogo');hl.style.opacity=cur.type==='end_card'?1-clamp((t-cur.start)/0.4):1;
  document.getElementById('g1').style.transform=`translate(${Math.sin(t*0.25)*40}px,${Math.cos(t*0.2)*30}px)`;
  // mascot
  const mg=document.getElementById('masc');const mood=cur.mood;
  if(mood&&mood!=='none'){const lt=t-cur.start;const prev=SC[SC.indexOf(cur)-1];const cont=prev&&prev.mood===mood;
    const p=cont?1:clamp((lt-0.5)/0.5);mg.style.opacity=p;mg.style.transform=`translateY(${(1-back(p))*60+Math.sin(t*2.2)*5}px)`;
    mg.querySelectorAll('.mood').forEach(g=>g.style.display=g.dataset.m===mood?'inline':'none');
    const blink=(t%3.2)<0.12;mg.querySelector('#eyes').style.transform=blink?'scaleY(0.1)':'scaleY(1)';
    const look=mood==='thinking'?[-3,-4]:[0,0];mg.querySelector('#pl').setAttribute('cx',76+look[0]);mg.querySelector('#pr').setAttribute('cx',118+look[0]);mg.querySelector('#pl').setAttribute('cy',103+look[1]);mg.querySelector('#pr').setAttribute('cy',103+look[1]);
    const ar=mg.querySelector('#armR');ar.style.transform=mood==='wave'?`rotate(${-110+Math.sin(t*7)*22}deg)`:(mood==='surprised'?'rotate(-40deg)':'rotate(0deg)');
    mg.querySelector('#armL').style.transform=mood==='surprised'?'rotate(30deg)':'';mg.querySelector('#armL').style.transformOrigin='38px 128px';
    mg.querySelector('#thumb').style.display=mood==='thumbs'?'inline':'none';}
  else{const prev=SC[SC.indexOf(cur)-1];const had=prev&&prev.mood&&prev.mood!=='none';mg.style.opacity=had?1-clamp((t-cur.start)/0.3):0;}
  // captions (all scenes except the end card)
  const cap=document.getElementById('cap');let shown=false;
  if(cur.type!=='end_card'&&CHUNKS.length){const si=SC.indexOf(cur);const ch=CHUNKS.find(c=>c[0].scene===si&&t>=c[0].t-0.05&&t<c[c.length-1].t+c[c.length-1].d+0.3);
    if(ch){shown=true;const key=ch[0].t;if(cap.dataset.k!=String(key)){cap.dataset.k=key;cap.innerHTML=ch.map(w=>'<span>'+esc(w.text)+'</span>').join(' ');}
      [...cap.children].forEach((sp,k)=>{const w=ch[k];sp.className=(t>=w.t&&t<w.t+w.d+0.08)?'on':'';});}}
  cap.style.opacity=shown?1:0;
}
</script>
